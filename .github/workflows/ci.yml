name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[search,dev]"

      # The retrieval eval tests load the real embedding model offline, so it
      # must be cached before pytest runs (they fail rather than skip without it).
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.fastembed-cache
          key: fastembed-bge-small-en-v1.5-${{ runner.os }}-v1

      - name: Prime embedding model
        env:
          FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed-cache
        run: python -c "from sahara.search.search_engine import load_embedding_model; load_embedding_model()"

      - name: Run tests with coverage
        env:
          FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed-cache
        run: pytest --cov=src/sahara --cov-report=term-missing --cov-fail-under=85

      - name: Lint
        run: ruff check src/ tests/

      - name: Type check
        run: mypy src/

  ios-foundation:
    name: Test iOS foundation package
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Swift package tests
        run: swift test --package-path apps/ios/SaharaMobileCore

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [test, ios-foundation]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
